baseURL = 'https://shibata.nyiyui.ca'

theme = 'hugo-pure'

enableRobotsTXT = true
googleAnalytics = "G-PLEJM83JCR"

enableGitInfo = true

defaultContentLanguage = 'en-ca'
[languages]
  [languages.en-ca]
    title = 'Ken Shibata'
    languageName = 'English'
    [languages.en-ca.menu]
      [[languages.en-ca.menu.main]]
        name = 'About'
        url = '/'
        weight = 10
      [[languages.en-ca.menu.main]]
        name = 'Projects'
        url = '/projects'
        weight = 20
      [[languages.en-ca.menu.main]]
        name = 'Weblog'
        url = '/log'
        weight = 30
      [[languages.en-ca.menu.main]]
        name = 'Etc'
        url = '/etc'
        weight = 40
      [[languages.en-ca.menu.main]]
        name = 'CV'
        url = '/Ken_Shibata_Resume.pdf'
        weight = 50
      [[languages.en-ca.menu.main]]
        name = 'VR Demo'
        url = 'https://hr-demo-app-server.vrsa.2kendon.ca'
        weight = 60
      [[languages.en-ca.menu.main]]
        name = 'Wiki'
        url = 'https://convind4.kiyuri.ca'
        weight = 70
  [languages.ja-jp]
    title = '柴田 謙'
    languageName = '日本語'
    [languages.ja-jp.menu]
      [[languages.ja-jp.menu.main]]
        name = '自己紹介'
        url = '/ja-jp/'
        weight = 10
      [[languages.ja-jp.menu.main]]
        name = 'プロジェクト'
        url = '/ja-jp/projects'
        weight = 20
      [[languages.ja-jp.menu.main]]
        name = 'ウェブログ'
        url = '/ja-jp/log'
        weight = 30
      [[languages.ja-jp.menu.main]]
        name = 'その他'
        url = '/ja-jp/etc'
        weight = 40
      [[languages.ja-jp.menu.main]]
        name = 'CV'
        url = '/Ken_Shibata_Resume.pdf'
        weight = 50
      [[languages.ja-jp.menu.main]]
        name = 'ウィキ'
        url = 'https://convind4.kiyuri.ca'
        weight = 70

[outputs]
  home = [ "HTML", "RSS" ]

[markup.goldmark.renderer]
  unsafe = true
  xhtml = true

  [markup.highlight]
    codeFences = true

  [markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true
  
  [markup.goldmark.parser]
    autoHeadingID = true
    autoHeadingIDType = 'github'
