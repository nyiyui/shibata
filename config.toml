baseURL = 'https://shibata.nyiyui.ca'

theme = 'hugo-pure'

enableRobotsTXT = true
googleAnalytics = "G-PLEJM83JCR"

enableGitInfo = true

defaultContentLanguage = 'en-ca'
[languages]
  [languages.en-ca]
    title = 'Ken Shibata'
    languageName = 'English'
    [languages.en-ca.menu]
      [[languages.en-ca.menu.main]]
        name = 'About'
        url = '/'
        weight = 10
      [[languages.en-ca.menu.main]]
        name = 'Projects'
        url = '/projects'
        weight = 20
      [[languages.en-ca.menu.main]]
        name = 'Etc'
        url = '/etc'
        weight = 30
  [languages.ja-jp]
    title = '柴田 謙'
    languageName = '日本語'
    [languages.ja-jp.menu]
      [[languages.ja-jp.menu.main]]
        name = '自己紹介'
        url = '/'
        weight = 10
      [[languages.ja-jp.menu.main]]
        name = 'プロジェクト'
        url = '/projects'
        weight = 20
      [[languages.ja-jp.menu.main]]
        name = 'その他'
        url = '/etc'
        weight = 30

[outputs]
  home = [ "HTML", "RSS" ]

[markup.goldmark.renderer]
  unsafe = true
  xhtml = true

  [markup.highlight]
    codeFences = true

  [markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true
  
  [markup.goldmark.parser]
    autoHeadingID = true
    autoHeadingIDType = 'github'

[params]
  [params.homeInfoParams]
    Title = "Ken Shibata's Website"
    Content = "I'm an undergraduate CS major at the Georgia Institute of Technology. I'm interested in computer science, human-computer interaction, trains, and 3D modeling, as shown by some of my projects below."
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/nyiyui"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:+@nyiyui.ca"
